name: Hurecom DEV CI

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ============================================================
      # 3. BUILD APPLICATION
      # ============================================================
      - name: Build JAR
        run: mvn clean package -DskipTests


      # ============================================================
      # 4. SHOW GENERATED JAR
      # ============================================================
      - name: Show generated JAR
        run: ls -lh target/*.jar


      # ============================================================
      # 5. COPY JAR TO DEV SERVER
      #
      # The SCP action preserves the target directory.
      #
      # Result:
      # C:\Apps\hurecom-dev\target\
      #       hurecom-0.0.1-SNAPSHOT.jar
      # ============================================================
      - name: Copy JAR to DEV server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          source: "target/hurecom-0.0.1-SNAPSHOT.jar"
          target: "${{ secrets.DEV_DEPLOY_PATH }}"


      # ============================================================
      # 6. DEPLOY + RESTART DEV + AUTOMATIC ROLLBACK
      # ============================================================
      - name: Deploy and restart DEV
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}

          script: |
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command "& {

              # ==================================================
              # CONFIGURATION
              # ==================================================

              `$ErrorActionPreference = 'Stop'

              `$deployPath = '${{ secrets.DEV_DEPLOY_PATH }}'

              `$stagedJar = '`$deployPath\target\hurecom-0.0.1-SNAPSHOT.jar'

              `$currentJar = '`$deployPath\hurecom.jar'

              `$backupJar = '`$deployPath\hurecom.jar.bak'

              `$javaExe = 'C:\Program Files\Java\jdk-17\bin\java.exe'

              `$port = 8280

              `$devUrl = 'http://localhost:8280'


              # ==================================================
              # START DEPLOYMENT
              # ==================================================

              Write-Host ''
              Write-Host '=================================================='
              Write-Host '        HURECOM DEV DEPLOYMENT'
              Write-Host '=================================================='
              Write-Host ''


              # ==================================================
              # CHECK STAGED JAR
              # ==================================================

              Write-Host 'Checking staged JAR...'

              if (!(Test-Path `$stagedJar)) {
                  throw "Staged JAR not found: `$stagedJar"
              }

              `$stagedInfo = Get-Item `$stagedJar

              Write-Host "Staged JAR:"
              Write-Host "  Name : `$(`$stagedInfo.Name)"
              Write-Host "  Size : `$(`$stagedInfo.Length) bytes"
              Write-Host "  Date : `$(`$stagedInfo.LastWriteTime)"



              # ==================================================
              # CHECK CURRENT DEV PROCESS
              # ==================================================

              Write-Host ''
              Write-Host 'Checking DEV process on port 8280...'

              `$devProcesses = Get-CimInstance Win32_Process | Where-Object {

                  `$_.CommandLine -and
                  `$_.CommandLine -match 'server\.port=8280' -and
                  `$_.CommandLine -match 'hurecom'
              }


              foreach (`$process in `$devProcesses) {

                  Write-Host "DEV process found: PID `$(`$process.ProcessId)"

              }



              # ==================================================
              # STOP ONLY DEV PROCESS
              # ==================================================

              Write-Host ''
              Write-Host 'Stopping DEV application...'

              foreach (`$process in `$devProcesses) {

                  Write-Host "Stopping PID `$(`$process.ProcessId)"

                  Stop-Process `
                      -Id `$process.ProcessId `
                      -Force `
                      -ErrorAction SilentlyContinue
              }


              Start-Sleep -Seconds 5



              # ==================================================
              # VERIFY PORT 8280 IS FREE
              # ==================================================

              Write-Host ''
              Write-Host 'Checking port 8280...'

              `$portCheck = Get-NetTCPConnection `
                  -LocalPort `$port `
                  -State Listen `
                  -ErrorAction SilentlyContinue


              if (`$portCheck) {

                  Write-Host ''
                  Write-Host 'ERROR: Port 8280 is still in use.'

                  `$portCheck |
                      Select-Object LocalAddress, LocalPort, OwningProcess |
                      Format-Table -AutoSize

                  throw 'Deployment stopped because port 8280 is still in use.'
              }


              Write-Host 'Port 8280 is free.'



              # ==================================================
              # BACKUP CURRENT JAR
              # ==================================================

              if (Test-Path `$currentJar) {

                  Write-Host ''
                  Write-Host 'Creating backup of current JAR...'

                  Copy-Item `
                      `$currentJar `
                      `$backupJar `
                      -Force

                  Write-Host "Backup created:"
                  Write-Host "`$backupJar"

              }
              else {

                  Write-Host ''
                  Write-Host 'No existing hurecom.jar found.'
                  Write-Host 'This appears to be the first deployment.'

              }



              # ==================================================
              # INSTALL NEW JAR
              # ==================================================

              Write-Host ''
              Write-Host 'Installing new JAR...'

              Copy-Item `
                  `$stagedJar `
                  `$currentJar `
                  -Force

              Write-Host "Installed:"
              Write-Host "`$currentJar"



              # ==================================================
              # START NEW DEV APPLICATION
              # ==================================================

              Write-Host ''
              Write-Host 'Starting new DEV application...'

              Start-Process `
                  -FilePath `$javaExe `
                  -ArgumentList '-jar', `$currentJar, '--server.port=8280' `
                  -WorkingDirectory `$deployPath


              Write-Host 'Application start command executed.'



              # ==================================================
              # WAIT FOR APPLICATION
              # ==================================================

              Write-Host ''
              Write-Host 'Waiting 15 seconds for application startup...'

              Start-Sleep -Seconds 15



              # ==================================================
              # VERIFY NEW DEV PORT
              # ==================================================

              Write-Host ''
              Write-Host 'Checking whether DEV is listening on port 8280...'

              `$newPortCheck = Get-NetTCPConnection `
                  -LocalPort `$port `
                  -State Listen `
                  -ErrorAction SilentlyContinue


              if (`$newPortCheck) {

                  Write-Host ''
                  Write-Host 'Port 8280 is listening.'
                  Write-Host 'New DEV application appears to be running.'



                  # ==============================================
                  # HTTP VERIFICATION
                  # ==============================================

                  Write-Host ''
                  Write-Host 'Testing DEV HTTP endpoint...'

                  try {

                      `$httpResponse = Invoke-WebRequest `
                          -Uri `$devUrl `
                          -UseBasicParsing `
                          -TimeoutSec 10 `
                          -ErrorAction Stop

                      Write-Host "HTTP Status: `$(`$httpResponse.StatusCode)"

                  }
                  catch {

                      # 403 is expected because Spring Security
                      # protects the root endpoint.

                      if (`$_.Exception.Response) {

                          `$statusCode = [int]`$_.Exception.Response.StatusCode

                          Write-Host "HTTP Status: `$statusCode"

                          if (`$statusCode -eq 403) {

                              Write-Host 'HTTP 403 received.'
                              Write-Host 'This is acceptable because the root endpoint requires authentication.'

                          }
                          else {

                              throw "Unexpected HTTP status: `$statusCode"

                          }

                      }
                      else {

                          throw 'DEV HTTP endpoint could not be reached.'

                      }

                  }



                  # ==============================================
                  # SUCCESS
                  # ==============================================

                  Write-Host ''
                  Write-Host '=================================================='
                  Write-Host '       HURECOM DEV DEPLOYMENT SUCCESSFUL'
                  Write-Host '=================================================='
                  Write-Host ''
                  Write-Host 'DEV URL : http://dev.hurecom.com'
                  Write-Host 'PORT    : 8280'
                  Write-Host ''


                  # ==============================================
                  # CLEAN STAGING FILE
                  # ==============================================

                  if (Test-Path `$stagedJar) {

                      Write-Host 'Removing staged JAR...'

                      Remove-Item `
                          `$stagedJar `
                          -Force

                  }


                  exit 0
              }



              # ==================================================
              # NEW VERSION FAILED
              # START ROLLBACK
              # ==================================================

              Write-Host ''
              Write-Host '=================================================='
              Write-Host '       NEW DEV VERSION FAILED TO START'
              Write-Host '       STARTING AUTOMATIC ROLLBACK'
              Write-Host '=================================================='
              Write-Host ''



              # ==================================================
              # STOP FAILED NEW VERSION
              # ==================================================

              `$failedProcesses = Get-CimInstance Win32_Process | Where-Object {

                  `$_.CommandLine -and
                  `$_.CommandLine -match 'server\.port=8280' -and
                  `$_.CommandLine -match 'hurecom\.jar'
              }


              foreach (`$process in `$failedProcesses) {

                  Write-Host "Stopping failed DEV PID `$(`$process.ProcessId)"

                  Stop-Process `
                      -Id `$process.ProcessId `
                      -Force `
                      -ErrorAction SilentlyContinue
              }


              Start-Sleep -Seconds 3



              # ==================================================
              # CHECK BACKUP
              # ==================================================

              if (!(Test-Path `$backupJar)) {

                  throw 'CRITICAL: Rollback cannot continue because hurecom.jar.bak does not exist.'
              }


              Write-Host ''
              Write-Host 'Backup found.'
              Write-Host "Restoring `$backupJar"



              # ==================================================
              # RESTORE PREVIOUS VERSION
              # ==================================================

              Copy-Item `
                  `$backupJar `
                  `$currentJar `
                  -Force


              Write-Host 'Previous JAR restored.'



              # ==================================================
              # START PREVIOUS VERSION
              # ==================================================

              Write-Host ''
              Write-Host 'Starting previous DEV version...'

              Start-Process `
                  -FilePath `$javaExe `
                  -ArgumentList '-jar', `$currentJar, '--server.port=8280' `
                  -WorkingDirectory `$deployPath


              Write-Host 'Rollback start command executed.'



              # ==================================================
              # WAIT FOR ROLLBACK
              # ==================================================

              Write-Host ''
              Write-Host 'Waiting 15 seconds for rollback startup...'

              Start-Sleep -Seconds 15



              # ==================================================
              # VERIFY ROLLBACK
              # ==================================================

              `$rollbackPortCheck = Get-NetTCPConnection `
                  -LocalPort `$port `
                  -State Listen `
                  -ErrorAction SilentlyContinue


              if (!`$rollbackPortCheck) {

                  Write-Host ''
                  Write-Host '=================================================='
                  Write-Host '       CRITICAL ROLLBACK FAILURE'
                  Write-Host '=================================================='
                  Write-Host ''

                  throw 'CRITICAL: Previous DEV version also failed to start on port 8280.'

              }



              # ==================================================
              # ROLLBACK SUCCESSFUL
              # ==================================================

              Write-Host ''
              Write-Host '=================================================='
              Write-Host '       AUTOMATIC ROLLBACK SUCCESSFUL'
              Write-Host '=================================================='
              Write-Host ''
              Write-Host 'Previous DEV version is running.'
              Write-Host 'Port 8280 is listening.'
              Write-Host ''


              # ==================================================
              # CLEAN STAGING FILE
              # ==================================================

              if (Test-Path `$stagedJar) {

                  Write-Host 'Removing failed staged JAR...'

                  Remove-Item `
                      `$stagedJar `
                      -Force

              }


              # ==================================================
              # MARK GITHUB ACTION AS FAILED
              #
              # The rollback succeeded, but the new deployment
              # failed, so GitHub Actions should show RED.
              # ==================================================

              throw 'New DEV JAR failed to start. Automatic rollback completed successfully.'

            }"