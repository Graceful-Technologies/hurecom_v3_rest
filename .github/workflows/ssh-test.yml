name: Hurecom DEV CI

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT SOURCE
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. SETUP JAVA 17
      # ============================================================
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # ============================================================
      # 3. BUILD APPLICATION
      # ============================================================
      - name: Build JAR
        run: mvn clean package -DskipTests


      # ============================================================
      # 4. SHOW GENERATED JAR
      # ============================================================
      - name: Show generated JAR
        run: ls -lh target/*.jar


      # ============================================================
      # 5. COPY JAR TO DEV SERVER
      # ============================================================
      - name: Copy JAR to DEV server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          source: "target/hurecom-0.0.1-SNAPSHOT.jar"
          target: "${{ secrets.DEV_DEPLOY_PATH }}"


      # ============================================================
      # 6. COPY DEPLOYMENT SCRIPT TO DEV SERVER
      # ============================================================
      - name: Copy deployment script
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PORT }}
          port: ${{ secrets.DEV_SSH_PORT }}
          source: "scripts/deploy.ps1"
          target: "${{ secrets.DEV_DEPLOY_PATH }}"


      # ============================================================
      # 7. RUN DEPLOYMENT SCRIPT
      # ============================================================
      - name: Deploy Hurecom DEV
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEV_SERVER_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "C:\Apps\hurecom-dev\scripts\deploy.ps1"